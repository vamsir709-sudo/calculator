<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./layter.css">
    <style>
        body{
    padding: 0;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    background-color: #37354c;
    height: 100vh;
    font-family: arial;
    overflow  : hidden;
}
.calculator{
    background-color: black;
    padding: 30px;
    border-radius: 10px;
    width: 260px;
    box-shadow: 0 13px 15px rgba(233, 237, 240, 0.5);
}
.box{
    height: 60px;
    width: 100%;
    font-size:26px ;
    margin-bottom: 15px;
    text-align: right;
    padding-right: 10px;
    border: none;
    border-radius: 6px;
    color: rgb(21, 18, 18);
    
}
.buttons{
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap:13px;
    
}
.zero{
    display: grid;
    grid-column-start:1;
    grid-column-end:3;
    padding-top: 20px;
    
    
}
button{
    height: 60px;
    font-size: 22px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    

}
button:hover{
    opacity: 0.8;
}
.oprator{
    color: white;
    background-color: orange;
}
.eqval{
    color: white;
    background-color: green;
}
.clear{
    color: white;
    background-color: red;
    font-size: 15px;
    font-weight: bold;

    
}

    </style>
</head>
<body>
    <div class="calculator">
        <input type="text" id="display" class="box" placeholder="0">
        <div class="buttons">
            <button class="clear" onclick="change('c')">AC</button>
            <button class="clear" onclick="del()">DEL</button>
            <button onclick="list('.')">.</button>
             <button class="oprator" onclick="list('%')">%</button>
            <button onclick="list('7')">7</button>
            <button onclick="list('8')">8</button>
            <button onclick="list('9')">9</button>
            <button class="oprator" onclick="list('/')">/</button>

            <button onclick="list('4')">4</button>
            <button onclick="list('5')">5</button>
            <button onclick="list('6')">6</button>
            <button class="oprator" onclick="list('*')">*</button>

            <button onclick="list('1')">1</button>
            <button onclick="list('2')">2</button>
            <button onclick="list('3')">3</button>
            <button class="oprator" onclick="list('-')">-</button>

            
            <button class="zero" onclick="list('0')">0</button>
            <button class="eqval" onclick="addcaluculator('=')">=</button>
            <button class="oprator" onclick="list('+')">+</button>
        </div>
    </div>
</body>
<script src="layter.js"></script>
</html>
